name: Prepare co-authored maintenance PR

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pair-extraordinaire.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create co-authored maintenance branch
        shell: bash
        run: |
          BRANCH="docs/coauthored-profile-maintenance"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          mkdir -p docs
          cat > docs/PROFILE_CHANGELOG.md <<'EOF'
          # Profile automation changelog

          This file records major infrastructure changes behind the dynamic GitHub profile.

          ## Private-aware metrics

          - Contribution wall uses authenticated GitHub GraphQL data.
          - Animated contribution visualization uses the same authenticated calendar.
          - GitHub signal aggregates owned repository metadata without publishing private repository names.
          - GitHub Actions refreshes generated profile assets automatically.

          ## Maintenance

          Profile automation dependencies are monitored with Dependabot.
          EOF

          git add docs/PROFILE_CHANGELOG.md
          git commit -m "docs: add profile automation changelog" -m "Co-authored-by: Jease <45035199+jease0502@users.noreply.github.com>"
          git push origin "$BRANCH"
