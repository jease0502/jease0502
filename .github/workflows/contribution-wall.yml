name: Refresh contribution wall

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/contribution-wall.yml"

permissions:
  contents: write

concurrency:
  group: contribution-wall
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest contribution wall
        shell: bash
        run: |
          mkdir -p assets
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://ghchart.rshah.org/39d353/${GITHUB_REPOSITORY_OWNER}" \
            -o assets/contribution-wall.svg

      - name: Commit refreshed chart when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-wall.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution wall"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
