name: Refresh private profile metrics

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/contribution-wall.yml"
      - "scripts/generate-contribution-wall.mjs"

permissions:
  contents: write

concurrency:
  group: private-profile-metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROFILE_PAT: ${{ secrets.PROFILE_PAT }}
      PROFILE_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify authenticated PAT
        shell: bash
        run: |
          if [ -z "$PROFILE_PAT" ]; then
            echo "::error::Missing PROFILE_PAT. For ALL private-aware widgets, use a classic PAT with repo + read:user and save it as the repository secret PROFILE_PAT."
            exit 1
          fi

      - name: Generate private-aware profile assets
        run: node scripts/generate-contribution-wall.mjs

      - name: Commit refreshed assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-wall.svg assets/private-snake.svg assets/github-signal.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh private profile metrics"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
