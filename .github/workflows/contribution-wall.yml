name: Refresh private contribution wall

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-wall
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROFILE_PAT: ${{ secrets.PROFILE_PAT }}
      PROFILE_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify PAT secret
        shell: bash
        run: |
          if [ -z "$PROFILE_PAT" ]; then
            echo "::error::Missing Actions secret PROFILE_PAT. Create a classic PAT with only read:user scope and save it as PROFILE_PAT."
            exit 1
          fi

      - name: Generate authenticated contribution wall
        run: node scripts/generate-contribution-wall.mjs

      - name: Commit refreshed wall when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-wall.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh private contribution wall"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
