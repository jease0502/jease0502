        <circle cy="-6" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" begin=".25s" repeatCount="indefinite"/></circle>
        <circle cx="-42" cy="14" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" begin=".5s" repeatCount="indefinite"/></circle>
        <circle cx="42" cy="14" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" begin=".75s" repeatCount="indefinite"/></circle>
        <circle cx="-30" cy="68" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" begin="1s" repeatCount="indefinite"/></circle>
        <circle cx="30" cy="68" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" begin="1.25s" repeatCount="indefinite"/></circle>
      </g>
