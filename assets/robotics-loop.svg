      <circle cx="-37" cy="20" r="5" fill="#58a6ff"/>
      <circle cx="-12" cy="-8" r="5" fill="#58a6ff"/>
      <circle cx="10" cy="8" r="5" fill="#58a6ff"/>
      <circle cx="38" cy="-29" r="5" fill="#58a6ff"/>
      <text y="90" fill="#f0f6fc" font-size="15">SIMULATE</text>
