<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Humanoid AI development loop">
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
