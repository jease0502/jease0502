<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Jease AI Robotics Engineer">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity=".25"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="258" rx="17" fill="none" stroke="#30363d"/>

  <g opacity=".7">
    <circle cx="58" cy="46" r="5" fill="#ff5f56"/>
    <circle cx="78" cy="46" r="5" fill="#ffbd2e"/>
    <circle cx="98" cy="46" r="5" fill="#27c93f"/>
  </g>

  <text x="60" y="108" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">&gt; identity --verbose</text>
  <text x="60" y="158" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="5">JEASE</text>
  <rect x="60" y="177" width="480" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="110;480;320;480" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="213" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">AI Robotics · Humanoid · VLA · Control · Sim-to-Real</text>

  <g transform="translate(785 128)" stroke="#39d353" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="0" cy="-58" r="24"/>
    <path d="M0-34V24M0-8L-48 12M0-8L48 12M0 24L-34 72M0 24L34 72"/>
    <g fill="#39d353" stroke="none">
      <circle cx="0" cy="-58" r="5"><animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="-8" r="5"><animate attributeName="r" values="4;8;4" dur="2.2s" begin=".25s" repeatCount="indefinite"/></circle>
      <circle cx="-48" cy="12" r="5"><animate attributeName="r" values="4;8;4" dur="2.2s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="48" cy="12" r="5"><animate attributeName="r" values="4;8;4" dur="2.2s" begin=".75s" repeatCount="indefinite"/></circle>
      <circle cx="-34" cy="72" r="5"><animate attributeName="r" values="4;8;4" dur="2.2s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="34" cy="72" r="5"><animate attributeName="r" values="4;8;4" dur="2.2s" begin="1.25s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <circle cx="946" cy="214" r="5" fill="#39d353">
    <animate attributeName="opacity" values="1;.15;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="925" y="220" text-anchor="end" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">BUILDING</text>
</svg>